<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPM Energie Admin</title><style>body{font-family:system-ui;margin:0;background:#f4f8fb;color:#0b1729}main{max-width:960px;margin:40px auto;padding:24px;background:#fff;border-radius:18px;box-shadow:0 16px 45px #1232}h1{letter-spacing:-.04em}p{color:#5b6b7d;line-height:1.5}.warning{padding:14px;background:#fff5dd;border-radius:10px}.tariff{padding:16px 0;border-top:1px solid #dbe5ee}.price{color:#07523f;font-weight:800}.muted{color:#63748a;font-size:.85rem}</style></head><body><main><h1>CPM Energie Tarifdaten</h1><p class="warning">Interne Übersicht. Diese Seite zeigt die zentrale Datenbank. Änderungen erfolgen derzeit über den Repository-Datensatz; Preise bitte vor Veröffentlichung im Partnerportal prüfen.</p><div id="app">Lade Tarifdaten …</div></main><script>fetch('/data/tariffs.json').then(r=>r.json()).then(d=>{const el=document.getElementById('app');el.innerHTML=d.tariffs.map(t=>`<article class="tariff"><h2>${t.provider} – ${t.tariffName}</h2><div>${t.postalArea} · ${t.places}</div><p class="price">${t.electricityWorkPrice.toFixed(2).replace('.',',')} ct/kWh · ${t.electricityBasePriceAnnual.toFixed(2).replace('.',',')} €/Jahr Grundpreis</p><div class="muted">1. Jahr: ${t.firstYearPrice?.toFixed(2).replace('.',',')||'–'} € · ${t.contractTerm||'–'} · Garantie: ${t.priceGuarantee||'–'}</div></article>`).join('')}).catch(()=>document.getElementById('app').textContent='Tarifdaten konnten nicht geladen werden.');</script></body></html>
